name: CI

# Berjalan di setiap push ke branch mana pun. Status ceknya menempel ke commit,
# jadi pull request dari branch yang sama ikut menampilkan hasilnya.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, uji
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Uji API memakai PostgreSQL asli (T11), versi sama dengan dev dan staging.
    services:
      postgres:
        image: postgres:18-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          POSTGRES_USER: tyio
          POSTGRES_PASSWORD: tyio
          POSTGRES_DB: tyio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tyio -d tyio_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://tyio:tyio@localhost:5432/tyio_test
    steps:
      # Action dipin ke SHA commit, bukan tag, agar tag yang dipindahkan tidak ikut terpakai.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Versi pnpm dibaca dari "packageManager" di package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Skrip backup/restore dijalankan di server; ShellCheck sudah terpasang di runner.
      - name: Lint skrip shell
        run: shellcheck -x deploy/scripts/*.sh

      - name: Build
        run: pnpm build

      - name: Uji
        run: pnpm test

  image:
    name: Image + uji asap lewat compose staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Image dibangun sekali, lalu dijalankan dengan berkas compose staging yang sama
    # seperti di server staging. Yang lolos uji asap inilah artefak untuk staging.
    env:
      TYIO_IMAGE: tyio-app:ci-${{ github.sha }}
      STAGING: docker compose --env-file ${{ github.workspace }}/../staging-ci.env -f deploy/compose.staging.yml
      PROD_ENV: ${{ github.workspace }}/../prod-ci.env
      PROD: docker compose --env-file ${{ github.workspace }}/../prod-ci.env -f deploy/compose.prod.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Pasang dependensi (untuk Playwright)
        run: pnpm install --frozen-lockfile

      - name: Bangun image
        run: docker build -f deploy/Dockerfile -t "$TYIO_IMAGE" .

      # Pasangan kunci backup sekali pakai: staging hanya menerima kunci publik; kunci privat
      # dipakai latihan restore di bawah. Service backup langsung membuat backup pertama, dan
      # `up --wait` baru selesai setelah backup itu ada (healthcheck service backup).
      - name: Jalankan image dengan compose staging
        id: staging
        run: |
          KUNCI="$RUNNER_TEMP/kunci-backup"
          export GNUPGHOME="$KUNCI/gnupg"
          mkdir -p -m 700 "$GNUPGHOME"
          gpg --batch --quiet --passphrase '' --quick-gen-key 'Tyio Backup CI <ci@tyio.invalid>' future-default default never
          gpg --armor --export ci@tyio.invalid > "$KUNCI/backup-public.asc"
          gpg --batch --pinentry-mode loopback --passphrase '' --armor --export-secret-keys ci@tyio.invalid > "$KUNCI/backup-private.asc"
          gpgconf --kill gpg-agent
          {
            echo "TYIO_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "TYIO_BACKUP_PUBLIC_KEY=$KUNCI/backup-public.asc"
            echo "TYIO_BACKUP_DIR=$RUNNER_TEMP/backup"
          } > "$GITHUB_WORKSPACE/../staging-ci.env"
          echo "BACKUP_PRIVATE_KEY=$KUNCI/backup-private.asc" >> "$GITHUB_ENV"
          echo "BACKUP_DIR=$RUNNER_TEMP/backup" >> "$GITHUB_ENV"
          $STAGING up -d --wait

      # Akun dummy untuk uji login, dengan kata sandi acak per run (staging tidak punya
      # kata sandi bawaan). Diteruskan ke docker lewat environment, bukan argumen.
      - name: Seed data dummy
        run: |
          SEED_USER_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$SEED_USER_PASSWORD"
          echo "E2E_USER_PASSWORD=$SEED_USER_PASSWORD" >> "$GITHUB_ENV"
          export SEED_USER_PASSWORD
          $STAGING run --rm --no-deps -T -e SEED_USER_PASSWORD app node dist/seed/run.js

      - name: Pasang Chromium untuk Playwright
        run: pnpm --filter @tyio/web exec playwright install --with-deps chromium

      # Staging memakai cookie Secure; Chromium menerimanya di http://localhost.
      # Service worker PWA juga hanya jalan di HTTPS atau localhost.
      # Semua berkas uji layar, tanpa daftar nama: daftar lama berhenti di ticket-create (1.3),
      # sehingga ticket-detail, ticket-queue, dan tt tidak pernah berjalan di CI.
      - name: Uji layar (semua berkas apps/web/e2e)
        run: pnpm e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      # Langkah 0.6: backup data staging yang sudah di-seed dan dipakai uji layar, lalu
      # pulihkan ke container PostgreSQL baru dan buktikan isinya cocok. Berkas backup milik
      # root (mode 600), jadi latihan berjalan dengan sudo. Terakhir, uji skrip backup sendiri
      # (berkas rusak, kunci salah, isi tidak cocok, retensi) di container image yang sama.
      - name: Backup, latihan restore, dan uji skrip backup
        run: |
          $STAGING exec -T backup /scripts/backup.sh
          sudo -E deploy/scripts/latihan-restore.sh
          DB_PASSWORD="$(grep '^TYIO_DB_PASSWORD=' "$GITHUB_WORKSPACE/../staging-ci.env" | cut -d= -f2)"
          echo "::add-mask::$DB_PASSWORD"
          export UJI_SERVER_URL="postgres://tyio:$DB_PASSWORD@db:5432/postgres"
          $STAGING run --rm --no-deps -T --entrypoint /scripts/uji-backup.sh -e UJI_SERVER_URL backup

      # Langkah 1.7 (T155): image yang sama dijalankan dengan compose produksi satu server
      # (Caddy di depan aplikasi, HTTPS dari CA internal Caddy, TYIO_ENV=production), lalu
      # diperiksa dengan skrip uji asap yang sama yang dijalankan di server sesudah memasang.
      # Akun uji dibuat dengan perintah pembuat pengguna, kata sandi lewat pipa.
      - name: Compose produksi satu server (Caddy, HTTPS) dan uji asap produksi
        id: prod
        run: |
          {
            echo "TYIO_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "TYIO_HOST=noc.tyio.test"
            echo "TYIO_TLS=internal"
            echo "TYIO_BACKUP_PUBLIC_KEY=$RUNNER_TEMP/kunci-backup/backup-public.asc"
            echo "TYIO_BACKUP_DIR=$RUNNER_TEMP/backup-prod"
          } > "$PROD_ENV"
          $PROD up -d --wait --no-build
          UJI_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$UJI_PASSWORD"
          printf '%s' "$UJI_PASSWORD" | $PROD run --rm --no-deps -T app \
            node dist/modules/users/create-user.js --email uji@noc.tyio.test --name "Uji Produksi" --role admin
          UJI_EMAIL=uji@noc.tyio.test UJI_PASSWORD="$UJI_PASSWORD" TYIO_ENV_FILE="$PROD_ENV" \
            deploy/scripts/uji-produksi.sh

      # Langkah-langkah terakhir hanya bila stack sempat dinyalakan; bila build gagal atau run
      # dibatalkan lebih awal, tidak ada yang perlu dibaca atau dibersihkan.
      - name: Log container bila gagal
        if: failure() && steps.staging.conclusion != 'skipped'
        run: $STAGING logs --no-color

      - name: Log container produksi bila gagal
        if: failure() && steps.prod.conclusion != 'skipped'
        run: $PROD logs --no-color

      - name: Bersihkan
        if: always() && steps.staging.conclusion != 'skipped'
        run: $STAGING down --volumes

      - name: Bersihkan produksi
        if: always() && steps.prod.conclusion != 'skipped'
        run: $PROD down --volumes
