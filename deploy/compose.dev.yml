# Lingkungan pengembangan: `pnpm dev:up` (bangun image, migrasi, seed, jalankan).
# Aplikasi: http://localhost:8080 · Postgres: localhost:5432 (database dev `npr`, uji `npr_test`).
# Semua port hanya terikat ke 127.0.0.1. Kredensial di sini khusus dev lokal.
name: npr-dev

x-app-env: &app-env
  NPR_ENV: development
  DATABASE_URL: postgres://npr:npr@db:5432/npr

services:
  db:
    image: postgres:18-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: npr
      POSTGRES_PASSWORD: npr
      POSTGRES_DB: npr
      TZ: UTC
    ports:
      - 127.0.0.1:${NPR_DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/dev-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U npr -d npr]
      interval: 2s
      timeout: 3s
      retries: 30

  # Satu image untuk tiga peran: migrasi, seed, dan aplikasi.
  migrate:
    image: npr-app:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      secrets: [extra_ca]
    command: [node, dist/db/migrate.js, up]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  seed:
    image: npr-app:dev
    pull_policy: never
    command: [node, dist/seed/run.js]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    image: npr-app:dev
    pull_policy: never
    environment: *app-env
    ports:
      - 127.0.0.1:${NPR_APP_PORT:-8080}:3000
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  db-data:

secrets:
  # Sertifikat CA tambahan untuk jaringan yang memeriksa TLS (proxy kantor).
  # Kosong secara bawaan. Bila perlu: salin berkas .pem ke deploy/certs/ (diabaikan git)
  # lalu set NPR_EXTRA_CA_FILE=./certs/<nama>.pem (relatif terhadap folder deploy/).
  extra_ca:
    file: ${NPR_EXTRA_CA_FILE:-./no-extra-ca.pem}
