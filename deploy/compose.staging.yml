# Lingkungan staging: menjalankan image yang sudah dibangun dan diuji CI, tidak membangun sendiri.
#   docker compose --env-file deploy/staging.env -f deploy/compose.staging.yml up -d --wait
# Isi deploy/staging.env dari deploy/staging.env.example (berkas .env tidak pernah masuk git).
name: npr-staging

x-app: &app
  image: ${NPR_IMAGE:?NPR_IMAGE wajib diisi dengan image hasil CI}
  pull_policy: missing
  environment:
    NPR_ENV: staging
    DATABASE_URL: postgres://npr:${NPR_DB_PASSWORD:?NPR_DB_PASSWORD wajib diisi}@db:5432/npr
    # Cookie sesi hanya dikirim lewat HTTPS (atau http://localhost). Lihat staging.env.example.
    SESSION_COOKIE_SECURE: ${NPR_SESSION_COOKIE_SECURE:-true}
    # Jumlah reverse proxy di depan aplikasi; kosong = langsung diakses.
    TRUST_PROXY: ${NPR_TRUST_PROXY:-}

services:
  db:
    image: postgres:18-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    environment:
      POSTGRES_USER: npr
      POSTGRES_PASSWORD: ${NPR_DB_PASSWORD:?NPR_DB_PASSWORD wajib diisi}
      POSTGRES_DB: npr
      TZ: UTC
    # Tanpa port ke host: database hanya bisa dicapai dari jaringan internal compose.
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U npr -d npr]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: [node, dist/db/migrate.js, up]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    ports:
      # Bawaan hanya 127.0.0.1. TLS dan akses dari jaringan lain menunggu keputusan hosting.
      - ${NPR_APP_BIND:-127.0.0.1}:${NPR_APP_PORT:-8080}:3000
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Backup terenkripsi harian (langkah 0.6, docs/operasi/backup.md). Image sama dengan db, yang
  # sudah membawa pg_dump, psql, dan gpg. Server hanya memegang kunci PUBLIK backup.
  backup:
    image: postgres:18-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    restart: unless-stopped
    entrypoint: [/scripts/backup-terjadwal.sh]
    environment:
      PGHOST: db
      PGUSER: npr
      PGPASSWORD: ${NPR_DB_PASSWORD:?NPR_DB_PASSWORD wajib diisi}
      PGDATABASE: npr
      BACKUP_DIR: /backup
      BACKUP_PUBLIC_KEY: /kunci/backup-public.asc
      BACKUP_LABEL: staging
      BACKUP_TIME_UTC: ${NPR_BACKUP_TIME_UTC:-18:30}
      BACKUP_RETENTION_DAYS: ${NPR_BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - ${NPR_BACKUP_DIR:-./backup}:/backup
      - ${NPR_BACKUP_PUBLIC_KEY:?NPR_BACKUP_PUBLIC_KEY wajib diisi (kunci publik backup, lihat docs/operasi/backup.md)}:/kunci/backup-public.asc:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # "unhealthy" bila tidak ada backup dalam 26 jam terakhir.
    healthcheck:
      test: [CMD, /scripts/backup-sehat.sh]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 2m
      start_interval: 5s

volumes:
  db-data:
