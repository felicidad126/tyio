<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Notifikasi di ponsel · Portal NOC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f6f8fb}
a{color:#066fd1;text-decoration:none}
a:hover{color:#0558a8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f6f8fb; color: #182433; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; font-variant-numeric: tabular-nums; overflow: hidden">

<header style="background: #ffffff; border-bottom: 1px solid #dce1e7; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column">
<h1 style="margin: 0; font-size: 22px; font-weight: 700">Notifikasi</h1>
<span style="font-size: 12px; color: #536173">Arif S. · L2 NOC · Shift Siang</span>
</div>
<button type="button" onClick="{{markAll}}" style="min-height: 44px; padding: 0 8px; border: 0; background: transparent; color: #066fd1; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Tandai semua dibaca</button>
</div>
<div role="tablist" aria-label="Saring notifikasi" style="display: flex; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="flex: 1 1 0; height: 44px; border: 0; background: transparent; font: inherit; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: -1px; color: {{t.fg}}; font-weight: {{t.weight}}; border-bottom: 2px solid {{t.line}}">
{{t.label}}
<sc-if value="{{t.hasCount}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #c42b2b; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{t.count}}</span>
</sc-if>
</button>
</sc-for>
</div>
</header>

<ul style="flex: 1 1 auto; overflow-y: auto; list-style: none; margin: 0; padding: 0">
<sc-for list="{{items}}" as="n" hint-placeholder-count="6">
<li style="position: relative; display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e3e7ec; background: {{n.rowBg}}">
<div style="flex: 0 0 auto; display: flex; align-items: flex-start; gap: 8px">
<span aria-hidden="true" style="width: 8px; height: 8px; margin-top: 14px; border-radius: 50%; background: {{n.dot}}"></span>
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{n.iconBg}}; color: {{n.iconFg}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
</span>
</div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
<span style="font-size: 15px; font-weight: {{n.weight}}">{{n.title}}</span>
<span style="flex: 0 0 auto; font-size: 12px; color: #536173">{{n.time}}</span>
</div>
<span style="font-size: 13px; color: #3c4858">{{n.body}}</span>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{n.unreadLabel}}</span>
<sc-if value="{{n.hasAction}}" hint-placeholder-val="{{ true }}">
<a href="{{n.href}}" style="align-self: flex-start; margin-top: 4px; min-height: 40px; padding: 0 14px; border-radius: 6px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 600; background: {{n.btnBg}}; color: {{n.btnFg}}; border: 1px solid {{n.btnBorder}}">{{n.action}}</a>
</sc-if>
</div>
</li>
</sc-for>
<li style="padding: 16px; text-align: center">
<button type="button" style="min-height: 44px; padding: 0 16px; border: 1px solid #c9d0d9; border-radius: 6px; background: #ffffff; color: #182433; font: inherit; font-weight: 600; cursor: pointer">Lihat notifikasi lebih lama</button>
</li>
</ul>

<nav aria-label="Navigasi utama" style="flex: 0 0 64px; display: flex; background: #ffffff; border-top: 1px solid #dce1e7">
<sc-for list="{{bottomNav}}" as="b" hint-placeholder-count="4">
<a href="{{b.href}}" aria-current="{{b.current}}" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; position: relative; color: {{b.fg}}; font-weight: {{b.weight}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"></path></svg>
{{b.label}}
<sc-if value="{{b.hasBadge}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; top: 8px; left: 52%; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: #c42b2b; color: #ffffff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{b.badge}}</span>
</sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var st = this.state || {};
    var self = this;
    var filter = st.filter || 'semua';
    var allRead = !!st.allRead;

    var IC = {
      alert: 'M12 9v4 M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z M12 16h.01',
      layers: 'M12 4l-8 4l8 4l8 -4l-8 -4 M4 12l8 4l8 -4 M4 16l8 4l8 -4',
      clock: 'M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0 M12 7v5l3 3',
      check: 'M5 12l5 5l10 -10',
      signal: 'M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0 M16.6 13.9a5 5 0 1 0 -9.2 0 M20.3 15.5a9 9 0 1 0 -16.6 0',
      pause: 'M6 5h4v14h-4z M14 5h4v14h-4z',
      dash: 'M4 4h6v8h-6z M14 4h6v4h-6z M14 12h6v8h-6z M4 16h6v4h-6z',
      ticket: 'M15 5v2 M15 11v2 M15 17v2 M5 5h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-3a2 2 0 0 0 0 -4v-3a2 2 0 0 1 2 -2',
      bell: 'M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6 M9 17v1a3 3 0 0 0 6 0v-1',
      user: 'M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0 M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2'
    };
    var KIND = {
      critical: ['#fbe3e3', '#a12424'],
      warning: ['#fcefd2', '#7a4a00'],
      info: ['#dfeafb', '#0b4f99'],
      good: ['#dcf2e1', '#1b6430'],
      neutral: ['#eaedf1', '#454f5c']
    };
    var raw = [
      { kind: 'critical', icon: IC.alert, title: 'SLA lewat · eskalasi ke Anda', body: 'NPR/VSAT/BNA/2026/11/0409 · ATM SPBU Daya, Makassar. Lewat 25 mnt.', time: '2 mnt', unread: true, action: 'Buka NPR', href: 'DetailTiket.dc.html', primary: true },
      { kind: 'critical', icon: IC.layers, title: 'Diduga gangguan massal', body: '14 remote di hub Palu-1 turun bersamaan sejak 16:41 WITA.', time: '17 mnt', unread: true, action: 'Tinjau saran Gamas', href: 'GamasDetail.dc.html', primary: true },
      { kind: 'warning', icon: IC.clock, title: 'SLA hampir lewat', body: 'NPR/VSAT/BNA/2026/11/0418 · ATM KCP Pasar Sentral. Sisa SLA di bawah 25%. Dikerjakan Dewi A. · L1.', time: '42 mnt', unread: true, action: 'Buka NPR', href: 'DetailTiket.dc.html', primary: false },
      { kind: 'good', icon: IC.check, title: 'Hasil kunjungan SD masuk', body: 'TT/VSAT/BSL/2026/11/0019 · ATM Bandara Sentani, Jayapura. Hasil sudah dicatat, TT siap ditutup L2.', time: '48 mnt', unread: true, action: 'Tinjau TT', href: 'DetailTiket.dc.html', primary: false },
      { kind: 'good', icon: IC.signal, title: 'Remote pulih', body: 'ATM Pasar Mardika, Ambon kembali online. NPR/VSAT/BAD/2026/11/0265 diperbarui otomatis.', time: '1 jam', unread: false, action: '', href: 'Segera.dc.html', primary: false },
      { kind: 'neutral', icon: IC.pause, title: 'Pending diperpanjang', body: 'NPR/VSAT/BNA/2026/11/0396 · ATM Pelabuhan Tual. Menunggu teknisi mitra (jadwal kapal).', time: '2 jam', unread: false, action: '', href: 'Segera.dc.html', primary: false }
    ];
    var unreadCount = allRead ? 0 : raw.filter(function (n) { return n.unread; }).length;
    var items = raw.filter(function (n) {
      return filter === 'semua' || (n.unread && !allRead);
    }).map(function (n) {
      var unread = n.unread && !allRead;
      var k = KIND[n.kind];
      return {
        title: n.title, body: n.body, time: n.time, icon: n.icon, iconBg: k[0], iconFg: k[1],
        dot: unread ? '#066fd1' : 'transparent', weight: unread ? 700 : 500,
        rowBg: unread ? '#f3f8fe' : '#ffffff',
        unreadLabel: unread ? 'Belum dibaca' : '',
        hasAction: !!n.action, action: n.action, href: n.href,
        btnBg: n.primary ? '#066fd1' : '#ffffff', btnFg: n.primary ? '#ffffff' : '#066fd1', btnBorder: n.primary ? '#066fd1' : '#9cc2ec'
      };
    });
    var tabs = [['semua', 'Semua', ''], ['belum', 'Belum dibaca', unreadCount ? String(unreadCount) : '']].map(function (t) {
      var on = t[0] === filter;
      return {
        label: t[1], count: t[2], hasCount: !!t[2], selected: on ? 'true' : 'false',
        fg: on ? '#066fd1' : '#536173', weight: on ? 600 : 500, line: on ? '#066fd1' : 'transparent',
        pick: function () { self.setState({ filter: t[0] }); }
      };
    });
    var bottomNav = [
      ['Overview', IC.dash, 'Main.dc.html', false, ''],
      ['Tiket', IC.ticket, 'Tiket.dc.html', false, ''],
      ['Notifikasi', IC.bell, 'Ponsel.dc.html', true, unreadCount ? String(unreadCount) : ''],
      ['Akun', IC.user, 'Segera.dc.html', false, '']
    ].map(function (b) {
      return {
        label: b[0], icon: b[1], href: b[2], current: b[3] ? 'page' : 'false',
        fg: b[3] ? '#066fd1' : '#536173', weight: b[3] ? 600 : 500,
        badge: b[4], hasBadge: !!b[4]
      };
    });
    return {
      tabs: tabs, items: items, bottomNav: bottomNav,
      markAll: function () { self.setState({ allRead: true }); }
    };
  }
}
</script>
</body>
</html>
