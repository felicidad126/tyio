# Menjalankan NPR di server sendiri.
#   docker compose up -d --build
#   docker compose exec app node dist/server/setup.js   (akun admin pertama)
#   docker compose exec app node dist/server/cadangan.js (cadangan database)
# Isi berkas .env di folder ini dengan alamat yang dibuka pengguna, mis.:
#   ALAMAT_PUBLIK=https://npr.contoh.id
# Aplikasi hanya terbuka di 127.0.0.1:3000; dari luar dibuka lewat Nginx.
name: npr-kp

services:
  app:
    # NPR_VERSI: commit yang dibangun, tampil di /api/health. Diisi oleh
    # scripts/perbarui-otomatis.sh; bila build manual:
    #   NPR_VERSI=$(git rev-parse --short=7 HEAD) docker compose up -d --build
    build:
      context: .
      args:
        NPR_VERSI: ${NPR_VERSI:-}
    image: npr-kp:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - npr-data:/data
    environment:
      TZ: Asia/Jakarta
      ALAMAT_PUBLIK: ${ALAMAT_PUBLIK:-}

volumes:
  npr-data:
